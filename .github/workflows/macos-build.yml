name: macOS build

on:
  push:
    branches:
      - main
      - automatic-external-openxr-handoff
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SwiftPM / macOS 15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out SwiftXRShell
        uses: actions/checkout@v4

      - name: Toolchain information
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version

      - name: Build and install Khronos OpenXR loader
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/KhronosGroup/OpenXR-SDK.git "$RUNNER_TEMP/OpenXR-SDK"

          cmake \
            -S "$RUNNER_TEMP/OpenXR-SDK" \
            -B "$RUNNER_TEMP/OpenXR-SDK-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DDYNAMIC_LOADER=ON \
            -DBUILD_TESTS=OFF

          cmake --build "$RUNNER_TEMP/OpenXR-SDK-build" --config Release --parallel
          sudo cmake --install "$RUNNER_TEMP/OpenXR-SDK-build" --config Release

      - name: Build shell (debug)
        run: swift build -v

      - name: Build shell (release)
        run: swift build -c release --product swiftxr-shell -v
